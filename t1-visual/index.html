<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>T1 · QEMU ↔ KVM 实验证据</title>
<style>body{background:#101827;color:#e3edfa;font:16px system-ui;margin:32px auto;max-width:1150px;padding:0 20px}h1{font-size:30px}button,input{padding:10px;border-radius:8px;border:1px solid #49617f;background:#203149;color:white}section{background:#19263a;padding:20px;border-radius:12px;margin:18px 0}.flow{display:flex;gap:12px;flex-wrap:wrap}.flow span{padding:16px;background:#253c58;border-radius:10px}table{width:100%;border-collapse:collapse}td,th{text-align:left;border-bottom:1px solid #36465c;padding:9px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px monospace;max-height:440px;overflow:auto}.ok{color:#62e0ae}.hint{color:#a8bdd6}summary{cursor:pointer;padding:10px}</style>
<h1>T1 · QEMU ↔ KVM 实验证据</h1><p class="hint">读取真实实验快照；不是实时监控。刷新页面只重新读取证据，不启动虚拟机。</p>
<button onclick="load()">刷新证据</button> <input id="file" type="file" accept=".json"><span id="status"> 正在读取…</span>
<section class="flow"><span>QEMU 用户态<br>创建 / 配置 / 设备模拟</span><span>→ /dev/kvm + ioctl →<br>共享 mmap 的 kvm_run</span><span>Linux KVM 内核态<br>运行客户机 / 返回退出原因</span></section>
<section id="facts"></section><section><h2>本次观测到的 KVM ioctl</h2><p class="hint">计数是调用次数，可能包含失败的能力探测；成功与否请核对原始返回值。</p><table><thead><tr><th>接口</th><th>调用次数</th><th>作用</th></tr></thead><tbody id="calls"></tbody></table></section>
<section><h2>源码证据（本机 QEMU 6.2.0）</h2><div id="sources"></div></section>
<section><h2>系统调用原始样本</h2><pre id="raw"></pre></section><section><h2>QEMU 运行退出 trace（末 50 行）</h2><pre id="trace"></pre></section>
<script src="evidence.js"></script><script>
const descriptions={KVM_GET_API_VERSION:'验证 ABI 版本（预期 12）',KVM_CHECK_EXTENSION:'探测内核能力',KVM_CREATE_VM:'创建 VM fd',KVM_CREATE_VCPU:'创建 vCPU fd',KVM_GET_VCPU_MMAP_SIZE:'查询共享 kvm_run 映射大小',KVM_SET_USER_MEMORY_REGION:'注册 GPA 到 QEMU 用户态内存的映射',KVM_SET_REGS:'写通用寄存器',KVM_SET_SREGS:'写特殊寄存器',KVM_RUN:'进入客户机，返回后读取 exit_reason',KVM_CREATE_IRQCHIP:'创建内核中断控制器',KVM_IRQFD:'绑定中断 eventfd',KVM_IOEVENTFD:'注册 I/O eventfd'};
function node(tag,text){const n=document.createElement(tag);n.textContent=text;return n}
function show(d){document.querySelector('#status').textContent='快照：'+d.time;const f=document.querySelector('#facts');f.replaceChildren(node('h2',d.passed?'✓ 可控客户机实验通过':'实验未通过，请查看日志'));f.className=d.passed?'ok':'';f.append(node('p',d.version+' | '+d.kernel),node('p','客户机输出：'+d.guest_output+'；QEMU 返回码：'+d.returncode+'（33 是本实验 debug-exit 的预期值）'),node('p','执行链：启动 → 注册内存 → 创建 vCPU → KVM_RUN → OUT 0xe9 输出 KVM! → OUT 0xf4 结束。完整日志见 evidence 目录。'));const t=document.querySelector('#calls');t.replaceChildren();for(const [k,v] of Object.entries(d.counts)){const tr=node('tr','');for(const s of [k,v,descriptions[k]||'架构配置 / 能力接口，详见原始日志与源码'])tr.append(node('td',s));t.append(tr)}const s=document.querySelector('#sources');s.replaceChildren();for(const x of d.sources){const det=node('details','');det.append(node('summary',x.file),node('p','SHA256: '+x.sha256),node('pre',x.hits.map(h=>h.line+': '+h.text).join('\n')));s.append(det)}document.querySelector('#raw').textContent=d.syscall_sample.join('\n');document.querySelector('#trace').textContent=d.trace_tail.join('\n')}
async function load(){if(location.protocol==='file:'&&window.T1_EVIDENCE){show(window.T1_EVIDENCE);return}try{const r=await fetch('evidence.json?t='+Date.now());if(!r.ok)throw Error(r.status);show(await r.json())}catch(e){document.querySelector('#status').textContent='请启动本地 HTTP 服务，或用旁边的文件框打开 evidence.json'}}document.querySelector('#file').onchange=async e=>show(JSON.parse(await e.target.files[0].text()));load();
</script></html>
